x-dotnet-healthcheck: &dotnet-healthcheck
  test:
    - CMD
    - bash
    - -c
    - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 30s

x-dotnet-environment: &dotnet-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

x-dotnet-depends-on: &dotnet-depends-on
  postgres:
    condition: service_healthy
  migrator:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:${POSTGRES_TAG}
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:${RABBITMQ_TAG}
    container_name: lms-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG}
    container_name: lms-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrator:
    build:
      context: .
      dockerfile: deploy/migrations/Dockerfile
    image: lms/migrator:${LMS_IMAGE_TAG}
    container_name: lms-migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COURSE_AUTHORING_CONNECTION: "Host=postgres;Port=5432;Database=course_authoring;Username=course_authoring_user;Password=course_authoring_dev"
      ENROLLMENT_CONNECTION: "Host=postgres;Port=5432;Database=enrollment;Username=enrollment_user;Password=enrollment_dev"
      LEARNING_CONNECTION: "Host=postgres;Port=5432;Database=learning;Username=learning_user;Password=learning_dev"
      CERTIFICATION_CONNECTION: "Host=postgres;Port=5432;Database=certification;Username=certification_user;Password=certification_dev"
      PURCHASE_CONNECTION: "Host=postgres;Port=5432;Database=purchase;Username=purchase_user;Password=purchase_dev"
      PAYMENTS_CONNECTION: "Host=postgres;Port=5432;Database=payments;Username=payments_user;Password=payments_dev"

  course-authoring:
    build:
      context: .
      dockerfile: src/services/course-authoring/CourseAuthoring.Api/Dockerfile
    image: lms/course-authoring:${LMS_IMAGE_TAG}
    container_name: lms-course-authoring
    profiles: ["core"]
    restart: unless-stopped
    depends_on: *dotnet-depends-on
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: course-authoring
      ConnectionStrings__CourseAuthoring: "Host=postgres;Port=5432;Database=course_authoring;Username=course_authoring_user;Password=course_authoring_dev"
      Authentication__MetadataAddress: http://keycloak:8080/realms/lms/.well-known/openid-configuration
    ports:
      - "127.0.0.1:5195:8080"
    healthcheck: *dotnet-healthcheck

  enrollment:
    build:
      context: .
      dockerfile: src/services/enrollment/Enrollments.Api/Dockerfile
    image: lms/enrollment:${LMS_IMAGE_TAG}
    container_name: lms-enrollment
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: enrollment
      ConnectionStrings__Enrollment: "Host=postgres;Port=5432;Database=enrollment;Username=enrollment_user;Password=enrollment_dev"
      Messaging__RabbitMq__Host: rabbitmq
      Services__CourseAuthoring__BaseUrl: http://course-authoring:8080
      Authentication__MetadataAddress: http://keycloak:8080/realms/lms/.well-known/openid-configuration
    ports:
      - "127.0.0.1:5196:8080"
    healthcheck: *dotnet-healthcheck

  learning:
    build:
      context: .
      dockerfile: src/services/learning/Learning.Api/Dockerfile
    image: lms/learning:${LMS_IMAGE_TAG}
    container_name: lms-learning
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: learning
      ConnectionStrings__Learning: "Host=postgres;Port=5432;Database=learning;Username=learning_user;Password=learning_dev"
      Messaging__RabbitMq__Host: rabbitmq
      Services__CourseAuthoring__BaseUrl: http://course-authoring:8080
      Authentication__MetadataAddress: http://keycloak:8080/realms/lms/.well-known/openid-configuration
    ports:
      - "127.0.0.1:5197:8080"
    healthcheck: *dotnet-healthcheck

  certification:
    build:
      context: .
      dockerfile: src/services/certification/Certification.Api/Dockerfile
    image: lms/certification:${LMS_IMAGE_TAG}
    container_name: lms-certification
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: certification
      ConnectionStrings__Certification: "Host=postgres;Port=5432;Database=certification;Username=certification_user;Password=certification_dev"
      Messaging__RabbitMq__Host: rabbitmq
      Services__CourseAuthoring__BaseUrl: http://course-authoring:8080
      Authentication__MetadataAddress: http://keycloak:8080/realms/lms/.well-known/openid-configuration
      Keycloak__AdminBaseUrl: http://keycloak:8080
      Keycloak__TokenEndpoint: http://keycloak:8080/realms/lms/protocol/openid-connect/token
      Keycloak__ClientSecret: ${CERTIFICATION_SVC_SECRET}
    ports:
      - "127.0.0.1:5198:8080"
    healthcheck: *dotnet-healthcheck

  bff-composition:
    build:
      context: .
      dockerfile: src/bff/BffComposition.Api/Dockerfile
    image: lms/bff-composition:${LMS_IMAGE_TAG}
    container_name: lms-bff-composition
    profiles: ["core"]
    restart: unless-stopped
    depends_on: *dotnet-depends-on
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: bff-composition
      Services__Learning__BaseUrl: http://learning:8080
      Services__CourseAuthoring__BaseUrl: http://course-authoring:8080
      Authentication__MetadataAddress: http://keycloak:8080/realms/lms/.well-known/openid-configuration
    ports:
      - "127.0.0.1:5199:8080"
    healthcheck: *dotnet-healthcheck

  gateway:
    build:
      context: .
      dockerfile: src/gateway/Gateway.Api/Dockerfile
    image: lms/gateway:${LMS_IMAGE_TAG}
    container_name: lms-gateway
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      course-authoring:
        condition: service_healthy
      enrollment:
        condition: service_healthy
      learning:
        condition: service_healthy
      certification:
        condition: service_healthy
      bff-composition:
        condition: service_healthy
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: gateway
      ReverseProxy__Clusters__course-authoring__Destinations__primary__Address: http://course-authoring:8080
      ReverseProxy__Clusters__enrollment__Destinations__primary__Address: http://enrollment:8080
      ReverseProxy__Clusters__learning__Destinations__primary__Address: http://learning:8080
      ReverseProxy__Clusters__certification__Destinations__primary__Address: http://certification:8080
      ReverseProxy__Clusters__bff__Destinations__primary__Address: http://bff-composition:8080
      ReverseProxy__Clusters__paid-enrollment__Destinations__primary__Address: http://paid-enrollment:8080
      Authentication__MetadataAddress: http://keycloak:8080/realms/lms/.well-known/openid-configuration
    ports:
      - "127.0.0.1:5202:8080"
    healthcheck: *dotnet-healthcheck

  paid-enrollment:
    build:
      context: .
      dockerfile: src/services/paid-enrollment/PaidEnrollment.Api/Dockerfile
    image: lms/paid-enrollment:${LMS_IMAGE_TAG}
    container_name: lms-paid-enrollment
    profiles: ["payments"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: paid-enrollment
      ConnectionStrings__PaidEnrollment: "Host=postgres;Port=5432;Database=purchase;Username=purchase_user;Password=purchase_dev"
      Messaging__RabbitMq__Host: rabbitmq
      Services__Enrollment__BaseUrl: http://enrollment:8080
      Services__Enrollment__TokenEndpoint: http://keycloak:8080/realms/lms/protocol/openid-connect/token
      Services__Enrollment__ClientSecret: ${PAID_ENROLLMENT_SVC_SECRET}
      Authentication__MetadataAddress: http://keycloak:8080/realms/lms/.well-known/openid-configuration
    ports:
      - "127.0.0.1:5200:8080"
    healthcheck: *dotnet-healthcheck

  payment-provider-sim:
    build:
      context: .
      dockerfile: src/services/payment-provider-sim/PaymentProviderSim.Worker/Dockerfile
    image: lms/payment-provider-sim:${LMS_IMAGE_TAG}
    container_name: lms-payment-provider-sim
    profiles: ["payments"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: payment-provider-sim
      ConnectionStrings__PaymentProviderSim: "Host=postgres;Port=5432;Database=payments;Username=payments_user;Password=payments_dev"
      Messaging__RabbitMq__Host: rabbitmq
    ports:
      - "127.0.0.1:5201:8080"
    healthcheck: *dotnet-healthcheck

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_TAG}
    container_name: lms-otel-collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro

  jaeger:
    image: jaegertracing/all-in-one:${JAEGER_TAG}
    container_name: lms-jaeger
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG}
    container_name: lms-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:${GRAFANA_TAG}
    container_name: lms-grafana
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
